<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jie</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body, html {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Change to 'contain' if you want the full picture visible without any cropping */
        display: block;
      }
    </style>
  </head>
  <body>
    <img src="jie.jpg" alt="Jie">
  </body>
</html>
